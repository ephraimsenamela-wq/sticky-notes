{% extends "notes/base.html" %}
{% block title %}Delete Note — Sticky Notes{% endblock %}
{% block content %}
<div class="form-wrap">
    <h1>Delete Note?</h1>
    <p>Are you sure you want to delete <strong>"{{ object.title }}"</strong>? This cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, delete</button>
        <a href="{% url 'notes:note-list' %}" class="btn btn-light">Cancel</a>
    </form>
</div>
{% endblock %}
