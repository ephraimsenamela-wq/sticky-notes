<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sticky Notes{% endblock %}</title>
    <!-- Bootstrap 5 (CDN) for rapid styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom sticky-note styling -->
    <link rel="stylesheet" href="{% static 'notes/css/style.css' %}">
</head>
<body>
<header class="app-header">
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="{% url 'notes:note-list' %}">📌 Sticky Notes</a>
            <div class="ms-auto">
                <a class="btn btn-add" href="{% url 'notes:note-create' %}">+ New Note</a>
            </div>
        </div>
    </nav>
</header>

<main class="container my-4">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-info">{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</main>

<footer class="text-center py-4 text-muted">
    <small>Sticky Notes app &bull; Django CRUD &bull; Bootcamp project</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
